name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Unit, domain, service and scenario tests
        run: npm test

      - name: Build the static demo
        run: npm run build:static

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright against the static demo
        run: npm run e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
