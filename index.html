    <script>
      // A page restored from the back-forward cache runs the bundle it was loaded with, which can
      // predate a deploy. Reload it: the step players keep their runs in session storage.
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) window.location.reload()
      })
